# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy — PRODUCTION (Blue/Green)
#
# Lo switch tra colori si fa commentando / scommentando le righe `server`
# dentro `upstream production`. La riga ATTIVA è quella non commentata.
# Lo script `scripts/blue-green-switch.sh` automatizza questa modifica e
# ricarica nginx senza downtime con `nginx -s reload`.
#
# Stato iniziale: ATTIVO = blue.
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    upstream production {
        # ACTIVE: blue
        server sentiment-api-blue:8000;
        # INACTIVE: green
        # server sentiment-api-green:8000;
    }

    server {
        listen 80;
        server_name _;

        # Propaga il request_id per il distributed tracing.
        # Se il client non lo invia, lo genera nginx.
        location / {
            proxy_pass http://production;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID      $http_x_request_id;
            proxy_read_timeout                 30s;
        }
    }
}
